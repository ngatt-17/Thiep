<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Outer subtle luxury ring -->
  <circle cx="80" cy="80" r="76" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 2" />
  <circle cx="80" cy="80" r="70" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.7" />
  
  <!-- Tiny decorative diamond cardinal accents -->
  <polygon points="80,6 82,8 80,10 78,8" fill="currentColor" fill-opacity="0.85" />
  <polygon points="80,150 82,152 80,154 78,152" fill="currentColor" fill-opacity="0.85" />
  <polygon points="10,80 12,78 14,80 12,82" fill="currentColor" fill-opacity="0.85" />
  <polygon points="146,80 148,78 150,80 148,82" fill="currentColor" fill-opacity="0.85" />

  <!-- Monogram Serif Letters 'T' and 'N' Interlocking -->
  <text x="56" y="95" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Cinzel', Georgia, serif" 
        font-size="52" 
        font-weight="400" 
        letter-spacing="-2"
        fill="currentColor" 
        text-anchor="middle">T</text>
  
  <text x="96" y="103" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Cinzel', Georgia, serif" 
        font-size="50" 
        font-weight="400" 
        letter-spacing="-1"
        fill="currentColor" 
        text-anchor="middle">N</text>

  <!-- Editorial Subtext along arch or bottom -->
  <text x="80" y="128" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="4" 
        fill="currentColor" 
        fill-opacity="0.75" 
        text-anchor="middle">MMXXVI</text>
</svg>
